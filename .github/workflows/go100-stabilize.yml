name: GO100 Stable Galaxy Baseline

on:
  push:
    branches: [go59-galaxy-systems]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stabilize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore known-good Galaxy shell
        run: |
          git checkout 1050cd1321ec61f37ef97baaf68bfa5802eabf6b -- lib/screens/galaxy_home_page.dart

      - name: Repair main navigation syntax
        shell: python
        run: |
          from pathlib import Path
          p = Path('lib/main.dart')
          s = p.read_text()
          broken = "Text('Een levende wereld. De werelden en content groeien mee met het systeem.')])),"
          fixed = "Text('Een levende wereld. De werelden en content groeien mee met het systeem.')]))) ,"
          if broken in s:
              s = s.replace(broken, fixed)
          p.write_text(s)

      - name: Replace Command Center with clean implementation
        shell: bash
        run: |
          cat > lib/screens/galaxy_command_center_page.dart <<'DART'
          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';
          import '../widgets/darkest_world_universe.dart';

          class GalaxyCommandCenterPage extends StatefulWidget {
            final List<GalaxyWorld> worlds;
            final GalaxyWorldKind? selected;
            final Set<GalaxyWorldKind> visited;
            final ValueChanged<GalaxyWorld> onOpen;

            const GalaxyCommandCenterPage({
              super.key,
              required this.worlds,
              required this.selected,
              required this.visited,
              required this.onOpen,
            });

            @override
            State<GalaxyCommandCenterPage> createState() => _GalaxyCommandCenterPageState();
          }

          class _GalaxyCommandCenterPageState extends State<GalaxyCommandCenterPage> {
            final TextEditingController _search = TextEditingController();
            int _cursor = 0;
            String _filter = 'ALL';

            List<GalaxyWorld> get _items {
              final q = _search.text.trim().toLowerCase();
              return widget.worlds.where((world) {
                final text = '${world.title} ${world.description}'.toLowerCase();
                final mapped = widget.visited.contains(world.kind);
                final textMatch = q.isEmpty || text.contains(q);
                final filterMatch = _filter == 'ALL' ||
                    (_filter == 'MAPPED' && mapped) ||
                    (_filter == 'UNMAPPED' && !mapped);
                return textMatch && filterMatch;
              }).toList();
            }

            @override
            void dispose() {
              _search.dispose();
              super.dispose();
            }

            void _sync() {
              final items = _items;
              if (items.isEmpty) {
                _cursor = 0;
                return;
              }
              final selectedIndex = items.indexWhere((w) => w.kind == widget.selected);
              if (selectedIndex >= 0) {
                _cursor = selectedIndex;
              } else {
                _cursor = _cursor.clamp(0, items.length - 1);
              }
            }

            void _move(int delta) {
              final items = _items;
              if (items.isEmpty) return;
              setState(() {
                _cursor = (_cursor + delta) % items.length;
                if (_cursor < 0) _cursor = items.length - 1;
              });
            }

            void _openCursor() {
              final items = _items;
              if (items.isNotEmpty) widget.onOpen(items[_cursor]);
            }

            @override
            Widget build(BuildContext context) {
              final items = _items;
              final compact = MediaQuery.sizeOf(context).width < 760;
              return Scaffold(
                backgroundColor: const Color(0xFF020308),
                body: SafeArea(
                  child: Focus(
                    autofocus: true,
                    onKeyEvent: (_, event) {
                      if (event is! KeyDownEvent) return KeyEventResult.ignored;
                      if (event.logicalKey == LogicalKeyboardKey.arrowDown ||
                          event.logicalKey == LogicalKeyboardKey.keyJ) {
                        _move(1);
                        return KeyEventResult.handled;
                      }
                      if (event.logicalKey == LogicalKeyboardKey.arrowUp ||
                          event.logicalKey == LogicalKeyboardKey.keyK) {
                        _move(-1);
                        return KeyEventResult.handled;
                      }
                      if (event.logicalKey == LogicalKeyboardKey.enter) {
                        _openCursor();
                        return KeyEventResult.handled;
                      }
                      return KeyEventResult.ignored;
                    },
                    child: Padding(
                      padding: EdgeInsets.all(compact ? 14 : 30),
                      child: Column(
                        crossAxisAlignment: CrossAxisAlignment.start,
                        children: [
                          Row(
                            children: [
                              const Expanded(
                                child: Column(
                                  crossAxisAlignment: CrossAxisAlignment.start,
                                  children: [
                                    Text('GALAXY COMMAND CENTER', style: TextStyle(color: Colors.white, fontSize: 18, letterSpacing: 4.5)),
                                    SizedBox(height: 5),
                                    Text('NAVIGATION / DISCOVERY / GATE CONTROL', style: TextStyle(color: Color(0x4DFFFFFF), fontSize: 7, letterSpacing: 1.8)),
                                  ],
                                ),
                              ),
                              Text('${widget.visited.length} / ${widget.worlds.length} MAPPED', style: const TextStyle(color: Color(0x59FFFFFF), fontSize: 7, letterSpacing: 1.2)),
                            ],
                          ),
                          const SizedBox(height: 18),
                          Row(
                            children: [
                              Expanded(
                                child: TextField(
                                  controller: _search,
                                  onChanged: (_) => setState(_sync),
                                  style: const TextStyle(color: Colors.white70, fontSize: 9),
                                  decoration: const InputDecoration(
                                    hintText: 'SEARCH GATES',
                                    hintStyle: TextStyle(color: Color(0x33FFFFFF), fontSize: 7, letterSpacing: 1.4),
                                    prefixIcon: Icon(Icons.search, color: Color(0x33FFFFFF), size: 15),
                                    enabledBorder: OutlineInputBorder(borderSide: BorderSide(color: Color(0x1AFFFFFF))),
                                    focusedBorder: OutlineInputBorder(borderSide: BorderSide(color: Color(0x40FFFFFF))),
                                  ),
                                ),
                              ),
                              const SizedBox(width: 8),
                              _Filter(label: 'ALL', active: _filter == 'ALL', onTap: () => setState(() { _filter = 'ALL'; _sync(); })),
                              const SizedBox(width: 5),
                              _Filter(label: 'MAPPED', active: _filter == 'MAPPED', onTap: () => setState(() { _filter = 'MAPPED'; _sync(); })),
                              const SizedBox(width: 5),
                              _Filter(label: 'UNMAPPED', active: _filter == 'UNMAPPED', onTap: () => setState(() { _filter = 'UNMAPPED'; _sync(); })),
                            ],
                          ),
                          const SizedBox(height: 14),
                          Expanded(
                            child: items.isEmpty
                                ? const Center(child: Text('NO GATES MATCH', style: TextStyle(color: Color(0x40FFFFFF), fontSize: 8, letterSpacing: 1.5)))
                                : GridView.builder(
                                    gridDelegate: SliverGridDelegateWithFixedCrossAxisCount(
                                      crossAxisCount: compact ? 1 : 2,
                                      crossAxisSpacing: 9,
                                      mainAxisSpacing: 9,
                                      childAspectRatio: compact ? 2.8 : 2.15,
                                    ),
                                    itemCount: items.length,
                                    itemBuilder: (_, index) {
                                      final world = items[index];
                                      final active = index == _cursor;
                                      final mapped = widget.visited.contains(world.kind);
                                      return Semantics(
                                        button: true,
                                        label: 'Command center gate ${world.title}',
                                        child: InkWell(
                                          onTap: () {
                                            setState(() => _cursor = index);
                                            widget.onOpen(world);
                                          },
                                          child: AnimatedContainer(
                                            duration: const Duration(milliseconds: 140),
                                            padding: const EdgeInsets.all(15),
                                            decoration: BoxDecoration(
                                              color: active ? Colors.white.withOpacity(.07) : Colors.white.withOpacity(.018),
                                              border: Border.all(color: active ? const Color(0x66FFFFFF) : const Color(0x1AFFFFFF)),
                                            ),
                                            child: Row(
                                              children: [
                                                Text('${widget.worlds.indexOf(world) + 1}'.padLeft(2, '0'), style: const TextStyle(color: Color(0x33FFFFFF), fontSize: 7)),
                                                const SizedBox(width: 14),
                                                Expanded(
                                                  child: Column(
                                                    crossAxisAlignment: CrossAxisAlignment.start,
                                                    mainAxisAlignment: MainAxisAlignment.center,
                                                    children: [
                                                      Text(world.title, style: TextStyle(color: active ? Colors.white : const Color(0xA6FFFFFF), fontSize: 10, letterSpacing: 1.4)),
                                                      const SizedBox(height: 5),
                                                      Text(world.description, maxLines: 2, overflow: TextOverflow.ellipsis, style: const TextStyle(color: Color(0x47FFFFFF), fontSize: 6.2, height: 1.35)),
                                                    ],
                                                  ),
                                                ),
                                                Column(
                                                  crossAxisAlignment: CrossAxisAlignment.end,
                                                  mainAxisAlignment: MainAxisAlignment.center,
                                                  children: [
                                                    Text(mapped ? 'MAPPED' : 'UNMAPPED', style: const TextStyle(color: Color(0x40FFFFFF), fontSize: 5)),
                                                    const SizedBox(height: 8),
                                                    Text(active ? 'ENTER  ↵' : 'OPEN  →', style: const TextStyle(color: Color(0x59FFFFFF), fontSize: 5.5, letterSpacing: .8)),
                                                  ],
                                                ),
                                              ],
                                            ),
                                          ),
                                        ),
                                      );
                                    },
                                  ),
                          ),
                          const SizedBox(height: 10),
                          Row(
                            children: [
                              const Text('↑ ↓ / J K  NAVIGATE', style: TextStyle(color: Color(0x2EFFFFFF), fontSize: 5.5, letterSpacing: 1.2)),
                              const SizedBox(width: 14),
                              const Text('ENTER  OPEN GATE', style: TextStyle(color: Color(0x2EFFFFFF), fontSize: 5.5, letterSpacing: 1.2)),
                              const Spacer(),
                              Text('${items.length} VISIBLE GATES', style: const TextStyle(color: Color(0x2EFFFFFF), fontSize: 5.5, letterSpacing: 1.2)),
                            ],
                          ),
                        ],
                      ),
                    ),
                  ),
                ),
              );
            }
          }

          class _Filter extends StatelessWidget {
            final String label;
            final bool active;
            final VoidCallback onTap;

            const _Filter({required this.label, required this.active, required this.onTap});

            @override
            Widget build(BuildContext context) {
              return Semantics(
                button: true,
                label: 'Filter $label',
                child: InkWell(
                  onTap: onTap,
                  child: AnimatedContainer(
                    duration: const Duration(milliseconds: 120),
                    padding: const EdgeInsets.symmetric(horizontal: 9, vertical: 11),
                    decoration: BoxDecoration(
                      color: active ? Colors.white.withOpacity(.06) : Colors.transparent,
                      border: Border.all(color: active ? const Color(0x3DFFFFFF) : const Color(0x14FFFFFF)),
                    ),
                    child: Text(label, style: TextStyle(color: active ? const Color(0x99FFFFFF) : const Color(0x3DFFFFFF), fontSize: 5.5, letterSpacing: 1)),
                  ),
                ),
              );
            }
          }
          DART

      - name: Format
        run: dart format lib test

      - name: Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Commit stable source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/main.dart lib/screens/galaxy_home_page.dart lib/screens/galaxy_command_center_page.dart
          git diff --cached --quiet || git commit -m "GO100: restore stable Galaxy baseline"
          git push origin HEAD:go59-galaxy-systems
