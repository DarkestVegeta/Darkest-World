name: GO96 Galaxy Stabilize

on:
  push:
    branches: [go59-galaxy-systems]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: go96-galaxy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stabilize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Repair Galaxy source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          paths = [
              Path('lib/main.dart'),
              Path('lib/screens/galaxy_home_page.dart'),
              Path('lib/screens/galaxy_command_center_page.dart'),
              Path('lib/widgets/darkest_world_universe.dart'),
          ]

          for path in paths:
              text = path.read_text(encoding='utf-8')

              # Flutter has no Colors.white10/20/30/... constants.
              def white(match):
                  percent = max(0, min(100, int(match.group(1))))
                  alpha = round(255 * percent / 100)
                  return f'Color(0x{alpha:02X}FFFFFF)'
              text = re.sub(r'Colors\.white(\d+)', white, text)

              if path.name == 'galaxy_home_page.dart':
                  open_line = '  void _openCommand() => setState(() => _commandOpen = true);'
                  close_line = '  void _closeCommand() => setState(() => _commandOpen = false);'
                  g_line = "    if (event.logicalKey == LogicalKeyboardKey.keyG) { _commandOpen ? _closeCommand() : _openCommand(); return KeyEventResult.handled; }"
                  lines = text.splitlines()
                  out = []
                  seen_open = seen_close = seen_g = False
                  for line in lines:
                      if line == open_line:
                          if seen_open: continue
                          seen_open = True
                      if line == close_line:
                          if seen_close: continue
                          seen_close = True
                      if line == g_line:
                          if seen_g: continue
                          seen_g = True
                      out.append(line)
                  text = '\n'.join(out) + ('\n' if text.endswith('\n') else '')

              if path.name == 'main.dart':
                  # Convert the legacy collection-for into a valid spread/map expression.
                  pattern = re.compile(
                      r'for \(final section in sections\)\s*_SectionButton\((.*?)\n\s*\),',
                      re.S,
                  )
                  text = pattern.sub(
                      lambda m: '...sections.map((section) => _SectionButton(' + m.group(1) + '\n    )),',
                      text,
                      count=1,
                  )

              path.write_text(text, encoding='utf-8')
          PY

      - name: Format
        run: dart format lib test

      - name: Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Commit stabilized source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib test
          if git diff --cached --quiet; then
            echo "No source changes needed."
          else
            git commit -m "GO96: stabilized Galaxy source"
            git push
          fi
