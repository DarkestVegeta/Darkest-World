name: GO99 Galaxy Repair
on:
  push:
    branches: [go59-galaxy-systems]
  workflow_dispatch:
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: go59-galaxy-systems
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Restore stable Galaxy home
        run: git show 1050cd1321ec61f37ef97baaf68bfa5802eabf6b:lib/screens/galaxy_home_page.dart > lib/screens/galaxy_home_page.dart
      - name: Replace Command Center
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('lib/screens/galaxy_command_center_page.dart')
          s = p.read_text()
          s = s.replace("Colors.white65", "const Color(0xA6FFFFFF)").replace("Colors.white25", "const Color(0x40FFFFFF)").replace("Colors.white18", "const Color(0x2EFFFFFF)").replace("Colors.white08", "const Color(0x14FFFFFF)").replace("Colors.white35", "const Color(0x59FFFFFF)")
          p.write_text(s)
          PY
      - name: Format
        run: dart format lib test
      - name: Dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Commit repaired source
        run: |
          git config user.name "DarkestVegeta"
          git config user.email "Darkest-Family@hotmail.com"
          git add lib/main.dart lib/screens/galaxy_home_page.dart lib/screens/galaxy_command_center_page.dart
          git diff --cached --quiet && exit 0
          git commit -m "GO99: restore stable Galaxy navigation"
          git push origin HEAD:go59-galaxy-systems
