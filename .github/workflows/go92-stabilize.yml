name: GO92 Galaxy Core Stabilization

on:
  push:
    branches: [go59-galaxy-systems]

permissions:
  contents: write

jobs:
  stabilize:
    if: "!contains(github.event.head_commit.message, '[GO92-STABILIZED]')"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: go59-galaxy-systems
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Restore coherent Galaxy home and normalize source
        shell: bash
        run: |
          set -e
          git checkout 1050cd1321ec61f37ef97baaf68bfa5802eabf6b -- lib/screens/galaxy_home_page.dart
          python3 - <<'PY'
          from pathlib import Path
          import re
          for p in Path('lib').rglob('*.dart'):
              s=p.read_text()
              s=re.sub(r'Colors\.white(\d+)', lambda m: f'Color(0x{round(int(m.group(1))*255/100):02X}FFFFFF)', s)
              if 'PointerScrollEvent' in s and "package:flutter/gestures.dart" not in s:
                  s="import 'package:flutter/gestures.dart';\n"+s
              if ('KeyDownEvent' in s or 'LogicalKeyboardKey' in s) and "package:flutter/services.dart" not in s:
                  s="import 'package:flutter/services.dart';\n"+s
              p.write_text(s)
          # Remove the invalid legacy command overlay from the home page; main.dart keeps the real command-center entry point.
          p=Path('lib/screens/galaxy_home_page.dart')
          s=p.read_text()
          s=s.replace("import 'galaxy_command_center_page.dart';\n", '')
          p.write_text(s)
          # Fix the legacy collection-for parser issue and invalid command icon color in main.dart.
          p=Path('lib/main.dart')
          s=p.read_text()
          s=s.replace("Text('⌘', style: TextStyle(color: Colors.white30, fontSize: 10))", "Text('⌘', style: TextStyle(color: Color(0x4DFFFFFF), fontSize: 10))")
          s=re.sub(r"for \(final section in sections\) _SectionButton\(label: section\.name, onTap: \(\) => _openSection\(context, section\)\),", "...sections.map((section) => _SectionButton(label: section.name, onTap: () => _openSection(context, section))),", s)
          p.write_text(s)
          PY
      - name: Rebuild command center as clean navigation page
        shell: bash
        run: |
          cat > lib/screens/galaxy_command_center_page.dart <<'DART'
          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';
          import '../widgets/darkest_world_universe.dart';

          class GalaxyCommandCenterPage extends StatefulWidget {
            final List<GalaxyWorld> worlds;
            final GalaxyWorldKind? selected;
            final Set<GalaxyWorldKind> visited;
            final ValueChanged<GalaxyWorld> onOpen;
            const GalaxyCommandCenterPage({super.key, required this.worlds, required this.selected, required this.visited, required this.onOpen});
            @override State<GalaxyCommandCenterPage> createState() => _GalaxyCommandCenterPageState();
          }

          class _GalaxyCommandCenterPageState extends State<GalaxyCommandCenterPage> {
            final _search = TextEditingController();
            int _filter = 0;
            int _cursor = 0;
            @override void dispose() { _search.dispose(); super.dispose(); }
            List<GalaxyWorld> get _items {
              final q = _search.text.trim().toLowerCase();
              return widget.worlds.where((w) {
                final matches = q.isEmpty || w.title.toLowerCase().contains(q) || w.description.toLowerCase().contains(q);
                final mapped = widget.visited.contains(w.kind);
                return matches && (_filter == 0 || (_filter == 1 && mapped) || (_filter == 2 && !mapped));
              }).toList();
            }
            void _move(int delta) { final items = _items; if (items.isEmpty) return; setState(() => _cursor = (_cursor + delta).clamp(0, items.length - 1)); }
            void _open() { final items = _items; if (items.isNotEmpty) widget.onOpen(items[_cursor.clamp(0, items.length - 1)]); }
            KeyEventResult _key(FocusNode node, KeyEvent event) {
              if (event is! KeyDownEvent) return KeyEventResult.ignored;
              if (event.logicalKey == LogicalKeyboardKey.escape) { Navigator.of(context).pop(); return KeyEventResult.handled; }
              if (event.logicalKey == LogicalKeyboardKey.arrowDown || event.logicalKey == LogicalKeyboardKey.keyJ) { _move(1); return KeyEventResult.handled; }
              if (event.logicalKey == LogicalKeyboardKey.arrowUp || event.logicalKey == LogicalKeyboardKey.keyK) { _move(-1); return KeyEventResult.handled; }
              if (event.logicalKey == LogicalKeyboardKey.enter) { _open(); return KeyEventResult.handled; }
              return KeyEventResult.ignored;
            }
            @override Widget build(BuildContext context) => Scaffold(
              backgroundColor: const Color(0xFF03040A),
              body: Focus(autofocus: true, onKeyEvent: _key, child: SafeArea(child: LayoutBuilder(builder: (context, c) {
                final items = _items;
                return Column(children: [
                  Padding(padding: const EdgeInsets.fromLTRB(24, 22, 24, 14), child: Row(children: [
                    IconButton(onPressed: () => Navigator.of(context).pop(), icon: const Icon(Icons.arrow_back, color: Colors.white54)),
                    const SizedBox(width: 8),
                    const Expanded(child: Column(crossAxisAlignment: CrossAxisAlignment.start, children: [Text('GALAXY COMMAND CENTER', style: TextStyle(color: Colors.white70, fontSize: 15, letterSpacing: 3)), SizedBox(height: 4), Text('Navigate every gate from one controlled map.', style: TextStyle(color: Colors.white30, fontSize: 9))])),
                    Text('${widget.visited.length}/${widget.worlds.length} MAPPED', style: const TextStyle(color: Colors.white38, fontSize: 8, letterSpacing: 1.5)),
                  ])),
                  Padding(padding: const EdgeInsets.symmetric(horizontal: 28), child: TextField(controller: _search, onChanged: (_) => setState(() => _cursor = 0), style: const TextStyle(color: Colors.white70, fontSize: 12), decoration: InputDecoration(prefixIcon: const Icon(Icons.search, color: Colors.white30), hintText: 'Search gates', hintStyle: const TextStyle(color: Colors.white24), filled: true, fillColor: Color(0x66090B14), border: OutlineInputBorder(borderSide: BorderSide(color: Color(0x1FFFFFFF))))))),
                  const SizedBox(height: 12),
                  Padding(padding: const EdgeInsets.symmetric(horizontal: 28), child: Row(children: [
                    _Filter(label: 'ALL', active: _filter == 0, onTap: () => setState(() => _filter = 0)),
                    _Filter(label: 'MAPPED', active: _filter == 1, onTap: () => setState(() => _filter = 1)),
                    _Filter(label: 'UNMAPPED', active: _filter == 2, onTap: () => setState(() => _filter = 2)),
                    const Spacer(), Text('${items.length} GATES', style: const TextStyle(color: Colors.white24, fontSize: 7, letterSpacing: 1.2)),
                  ])),
                  const SizedBox(height: 14),
                  Expanded(child: items.isEmpty ? const Center(child: Text('NO GATES MATCH', style: TextStyle(color: Colors.white30, fontSize: 9, letterSpacing: 2))) : GridView.builder(padding: const EdgeInsets.fromLTRB(28, 0, 28, 28), gridDelegate: SliverGridDelegateWithFixedCrossAxisCount(crossAxisCount: c.maxWidth > 1000 ? 3 : 2, crossAxisSpacing: 12, mainAxisSpacing: 12, childAspectRatio: 2.5), itemCount: items.length, itemBuilder: (context, i) { final w=items[i]; final active=i==_cursor; final mapped=widget.visited.contains(w.kind); return InkWell(onTap: () => widget.onOpen(w), child: AnimatedContainer(duration: const Duration(milliseconds: 140), padding: const EdgeInsets.all(15), decoration: BoxDecoration(color: active ? const Color(0x221A1D2A) : const Color(0x120A0C14), border: Border.all(color: active ? const Color(0x66FFFFFF) : const Color(0x18FFFFFF))), child: Column(crossAxisAlignment: CrossAxisAlignment.start, mainAxisAlignment: MainAxisAlignment.center, children: [Row(children: [Text(w.title, style: const TextStyle(color: Colors.white70, fontSize: 11, letterSpacing: 1.2)), const Spacer(), Text(mapped ? 'MAPPED' : 'UNMAPPED', style: const TextStyle(color: Colors.white30, fontSize: 6, letterSpacing: 1.2))]), const SizedBox(height: 7), Text(w.description, maxLines: 2, overflow: TextOverflow.ellipsis, style: const TextStyle(color: Colors.white30, fontSize: 8, height: 1.3))]))); })),
                  const Padding(padding: EdgeInsets.only(bottom: 14), child: Text('↑ ↓ / J K  NAVIGATE    ENTER  OPEN    ESC  CLOSE', style: TextStyle(color: Colors.white18, fontSize: 6, letterSpacing: 1.2))),
                ]);
              }))),
            );
          }

          class _Filter extends StatelessWidget { final String label; final bool active; final VoidCallback onTap; const _Filter({required this.label, required this.active, required this.onTap}); @override Widget build(BuildContext context) => Padding(padding: const EdgeInsets.only(right: 6), child: InkWell(onTap: onTap, child: Container(padding: const EdgeInsets.symmetric(horizontal: 10, vertical: 7), decoration: BoxDecoration(color: active ? const Color(0x22FFFFFF) : Colors.transparent, border: Border.all(color: active ? const Color(0x55FFFFFF) : const Color(0x18FFFFFF))), child: Text(label, style: TextStyle(color: active ? Colors.white70 : Colors.white28, fontSize: 6, letterSpacing: 1.2))))); }
          DART
      - name: Format and verify
        shell: bash
        run: |
          dart format lib test
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test
      - name: Commit stabilized source
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib .github/workflows/go92-stabilize.yml
          git diff --cached --quiet && exit 0
          git commit -m 'GO92: stabilized Galaxy core [GO92-STABILIZED]'
          git push origin go59-galaxy-systems
