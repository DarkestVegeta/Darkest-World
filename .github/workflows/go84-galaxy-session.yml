name: GO85 Galaxy Session Patch

on:
  push:
    branches:
      - go59-galaxy-systems

permissions:
  contents: write

jobs:
  patch-galaxy:
    if: ${{ !contains(github.event.head_commit.message, '[GO85-PATCHED]') && !contains(github.event.head_commit.message, '[GO84-PATCHED]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply session layer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/screens/galaxy_home_page.dart')
          s = p.read_text(encoding='utf-8')
          marker = 'GO84_SESSION_LAYER'
          if marker in s:
              print('Session layer already present')
              raise SystemExit(0)
          s = s.replace(
              'bool _appActive = true, _atlasOpen = false;',
              'bool _appActive = true, _atlasOpen = false, _sessionOpen = false; // GO84_SESSION_LAYER',
              1,
          )
          s = s.replace(
              'void _closeAtlas() => setState(() => _atlasOpen = false);',
              'void _closeAtlas() => setState(() => _atlasOpen = false);\n  void _toggleSession() => setState(() => _sessionOpen = !_sessionOpen);\n  void _closeSession() => setState(() => _sessionOpen = false);',
              1,
          )
          s = s.replace(
              "if (event.logicalKey == LogicalKeyboardKey.keyA) { _atlasOpen ? _closeAtlas() : _openAtlas(); return KeyEventResult.handled; }",
              "if (event.logicalKey == LogicalKeyboardKey.keyA) { _atlasOpen ? _closeAtlas() : _openAtlas(); return KeyEventResult.handled; }\n    if (event.logicalKey == LogicalKeyboardKey.keyS) { _toggleSession(); return KeyEventResult.handled; }",
              1,
          )
          s = s.replace(
              'if (compact) Positioned(right: 12, top: 12, child: _AtlasButton(onTap: _openAtlas)),',
              'if (compact) Positioned(right: 12, top: 12, child: _AtlasButton(onTap: _openAtlas)),\n        if (compact) Positioned(left: 12, top: 12, child: _SessionButton(onTap: _toggleSession)),\n        if (!compact) Positioned(top: 28, right: 28, child: _SessionButton(onTap: _toggleSession)),',
              1,
          )
          s = s.replace(
              'if (_atlasOpen) _GalaxyAtlas(worlds: worlds, selected: _commandSelection, visited: _visited, onClose: _closeAtlas, onOpen: (w) { _closeAtlas(); _openWorld(w); }),',
              "if (_sessionOpen) _GalaxySession(worlds: worlds, selected: _commandSelection, visited: _visited, history: _history, visits: _visitCount, lastVisited: _lastVisited, onClose: _closeSession, onOpen: _openWorld, onReset: _resetSession),\n        if (_atlasOpen) _GalaxyAtlas(worlds: worlds, selected: _commandSelection, visited: _visited, onClose: _closeAtlas, onOpen: (w) { _closeAtlas(); _openWorld(w); }),",
              1,
          )
          insert = r'''

class _SessionButton extends StatelessWidget {
  final VoidCallback onTap;
  const _SessionButton({required this.onTap});
  @override
  Widget build(BuildContext context) => Semantics(
    button: true,
    label: 'Open galaxy session command',
    child: Material(
      color: const Color(0xD905060D),
      child: InkWell(
        onTap: onTap,
        child: Container(
          padding: const EdgeInsets.symmetric(horizontal: 11, vertical: 8),
          decoration: BoxDecoration(border: Border.all(color: Colors.white12)),
          child: const Row(mainAxisSize: MainAxisSize.min, children: [
            Text('SESSION', style: TextStyle(color: Colors.white54, fontSize: 6.5, letterSpacing: 1.5)),
            SizedBox(width: 7),
            Text('S', style: TextStyle(color: Colors.white20, fontSize: 6)),
          ]),
        ),
      ),
    ),
  );
}

class _GalaxySession extends StatelessWidget {
  final List<GalaxyWorld> worlds;
  final GalaxyWorldKind? selected;
  final Set<GalaxyWorldKind> visited;
  final List<GalaxyWorldKind> history;
  final int visits;
  final String? lastVisited;
  final VoidCallback onClose;
  final ValueChanged<GalaxyWorld> onOpen;
  final VoidCallback onReset;
  const _GalaxySession({required this.worlds, required this.selected, required this.visited, required this.history, required this.visits, required this.lastVisited, required this.onClose, required this.onOpen, required this.onReset});

  @override
  Widget build(BuildContext context) {
    final size = MediaQuery.sizeOf(context);
    final compact = size.width < 700;
    final recent = <GalaxyWorld>[];
    for (final kind in history.reversed) {
      for (final world in worlds) {
        if (world.kind == kind) { recent.add(world); break; }
      }
    }
    final progress = worlds.isEmpty ? 0.0 : visited.length / worlds.length;
    return Positioned.fill(
      child: Material(
        color: const Color(0xE5010208),
        child: SafeArea(
          child: Center(
            child: ConstrainedBox(
              constraints: const BoxConstraints(maxWidth: 820, maxHeight: 680),
              child: Padding(
                padding: EdgeInsets.all(compact ? 14 : 30),
                child: Column(crossAxisAlignment: CrossAxisAlignment.start, children: [
                  Row(children: [
                    const Expanded(child: Column(crossAxisAlignment: CrossAxisAlignment.start, children: [
                      Text('GALAXY SESSION', style: TextStyle(color: Colors.white, fontSize: 18, letterSpacing: 4.5)),
                      SizedBox(height: 5),
                      Text('CURRENT EXPLORATION STATE', style: TextStyle(color: Colors.white30, fontSize: 6.5, letterSpacing: 1.8)),
                    ])),
                    InkWell(onTap: onClose, child: Container(padding: const EdgeInsets.symmetric(horizontal: 11, vertical: 8), decoration: BoxDecoration(border: Border.all(color: Colors.white18)), child: const Text('CLOSE  ×', style: TextStyle(color: Colors.white50, fontSize: 6, letterSpacing: 1.2)))),
                  ]),
                  const SizedBox(height: 16),
                  Wrap(spacing: 8, runSpacing: 8, children: [
                    _SessionMetric(label: 'GATES MAPPED', value: '${visited.length} / ${worlds.length}'),
                    _SessionMetric(label: 'TOTAL VISITS', value: '$visits'),
                    _SessionMetric(label: 'LAST GATE', value: (lastVisited ?? 'NONE').toUpperCase()),
                  ]),
                  const SizedBox(height: 12),
                  ClipRRect(borderRadius: BorderRadius.circular(2), child: LinearProgressIndicator(value: progress.clamp(0.0, 1.0), minHeight: 3, backgroundColor: Colors.white10, valueColor: const AlwaysStoppedAnimation<Color>(Colors.white54))),
                  const SizedBox(height: 16),
                  Row(children: [
                    const Text('SESSION ROUTE', style: TextStyle(color: Colors.white35, fontSize: 6, letterSpacing: 1.8)),
                    const Spacer(),
                    InkWell(onTap: onReset, child: const Padding(padding: EdgeInsets.all(4), child: Text('RESET SESSION', style: TextStyle(color: Colors.white25, fontSize: 5.5, letterSpacing: 1)))),
                  ]),
                  const SizedBox(height: 8),
                  Expanded(child: recent.isEmpty
                    ? const Center(child: Text('NO GATES VISITED YET', style: TextStyle(color: Colors.white25, fontSize: 7, letterSpacing: 1.4)))
                    : ListView.separated(
                        itemCount: recent.length,
                        separatorBuilder: (_, __) => const SizedBox(height: 5),
                        itemBuilder: (_, i) {
                          final world = recent[i];
                          final active = selected == world.kind;
                          return InkWell(
                            onTap: () => onOpen(world),
                            child: AnimatedContainer(
                              duration: const Duration(milliseconds: 150),
                              padding: const EdgeInsets.all(10),
                              decoration: BoxDecoration(color: active ? Colors.white.withOpacity(.07) : Colors.white.withOpacity(.025), border: Border.all(color: active ? Colors.white30 : Colors.white12)),
                              child: Row(children: [
                                Text('${i + 1}'.padLeft(2, '0'), style: const TextStyle(color: Colors.white20, fontSize: 6)),
                                const SizedBox(width: 10),
                                Expanded(child: Column(crossAxisAlignment: CrossAxisAlignment.start, children: [
                                  Text(world.title, style: const TextStyle(color: Colors.white70, fontSize: 8, letterSpacing: 1)),
                                  const SizedBox(height: 2),
                                  Text(world.description, maxLines: 1, overflow: TextOverflow.ellipsis, style: const TextStyle(color: Colors.white22, fontSize: 5.5)),
                                ])),
                                Text(active ? 'CURRENT' : 'OPEN', style: TextStyle(color: active ? Colors.white55 : Colors.white20, fontSize: 5, letterSpacing: 1)),
                              ]),
                            ),
                          );
                        },
                      )),
                  const SizedBox(height: 8),
                  const Text('S / ESC TO CLOSE', style: TextStyle(color: Colors.white18, fontSize: 5.5, letterSpacing: 1.2)),
                ]),
              ),
            ),
          ),
        ),
      ),
    );
  }
}

class _SessionMetric extends StatelessWidget {
  final String label, value;
  const _SessionMetric({required this.label, required this.value});
  @override
  Widget build(BuildContext context) => Container(
    constraints: const BoxConstraints(minWidth: 150),
    padding: const EdgeInsets.all(11),
    decoration: BoxDecoration(color: Colors.white.withOpacity(.025), border: Border.all(color: Colors.white12)),
    child: Column(crossAxisAlignment: CrossAxisAlignment.start, children: [
      Text(label, style: const TextStyle(color: Colors.white22, fontSize: 5.2, letterSpacing: 1)),
      const SizedBox(height: 4),
      Text(value, maxLines: 1, overflow: TextOverflow.ellipsis, style: const TextStyle(color: Colors.white70, fontSize: 9)),
    ]),
  );
}
'''
          s = s.rstrip() + insert
          p.write_text(s, encoding='utf-8')
          print('Session layer patched')
          PY
      - name: Commit patched Galaxy
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/screens/galaxy_home_page.dart
          git diff --cached --quiet && exit 0
          git commit -m 'GO85: Galaxy session command layer [GO85-PATCHED]'
          git push