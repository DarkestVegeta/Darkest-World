name: GO86 Galaxy Repair

on:
  push:
    branches: [go59-galaxy-systems]

permissions:
  contents: write

jobs:
  repair:
    if: !contains(github.event.head_commit.message, '[GO86-REPAIRED]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Repair Flutter APIs and color constants
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path('lib')
          for path in root.rglob('*.dart'):
              text = path.read_text(encoding='utf-8')
              original = text

              if 'KeyDownEvent' in text or 'LogicalKeyboardKey' in text:
                  if "import 'package:flutter/services.dart';" not in text:
                      text = "import 'package:flutter/services.dart';\n" + text
              if 'PointerScrollEvent' in text:
                  if "import 'package:flutter/gestures.dart';" not in text:
                      text = "import 'package:flutter/gestures.dart';\n" + text

              def white(m):
                  n = int(m.group(1))
                  n = max(0, min(100, n))
                  alpha = round(n * 255 / 100)
                  return f'const Color(0x{alpha:02X}FFFFFF)'

              text = re.sub(r'Colors\\.white(\\d+)', white, text)
              if text != original:
                  path.write_text(text, encoding='utf-8')

          print('API/color repair pass complete')
      - name: Format repaired Dart
        shell: bash
        run: |
          dart format lib test || true
      - name: Analyze repaired tree
        shell: bash
        run: flutter analyze --no-fatal-infos || true
      - name: Commit repair
        shell: bash
        run: |
          git config user.name "DarkestVegeta"
          git config user.email "Darkest-Family@hotmail.com"
          git add lib test
          if git diff --cached --quiet; then
            echo "No source changes needed."
            exit 0
          fi
          git commit -m "GO86: repair Galaxy Flutter compatibility [GO86-REPAIRED]"
          git push
