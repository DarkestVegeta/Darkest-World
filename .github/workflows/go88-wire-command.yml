name: GO88 Wire Command Center
on:
  push:
    branches: [go59-galaxy-systems]
permissions:
  contents: write
jobs:
  wire:
    if: ${{ !contains(github.event.head_commit.message, '[GO88-WIRED]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire command center
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/screens/galaxy_home_page.dart')
          s = p.read_text()
          if "import 'galaxy_command_center_page.dart';" not in s:
              s = s.replace("import 'music_world_page.dart';", "import 'music_world_page.dart';\nimport 'galaxy_command_center_page.dart';", 1)
          s = s.replace("bool _appActive = true, _atlasOpen = false;", "bool _appActive = true, _atlasOpen = false, _commandOpen = false;", 1)
          s = s.replace("void _closeAtlas() => setState(() => _atlasOpen = false);", "void _closeAtlas() => setState(() => _atlasOpen = false);\n  void _openCommand() => setState(() => _commandOpen = true);\n  void _closeCommand() => setState(() => _commandOpen = false);", 1)
          s = s.replace("if (event.logicalKey == LogicalKeyboardKey.keyA) {", "if (event.logicalKey == LogicalKeyboardKey.keyG) { _commandOpen ? _closeCommand() : _openCommand(); return KeyEventResult.handled; }\n    if (event.logicalKey == LogicalKeyboardKey.keyA) {", 1)
          marker = "if (compact) Positioned(right: 12, top: 12, child: _AtlasButton(onTap: _openAtlas)),"
          if marker in s and '_CommandButton(onTap: _openCommand)' not in s:
              s = s.replace(marker, marker + "\n        if (compact) Positioned(left: 12, top: 12, child: _CommandButton(onTap: _openCommand)),", 1)
          marker2 = "Center(child: _GalaxyModeStrip(worldCount: worlds.length, synced: synced, complete: complete, onAtlas: _openAtlas))"
          if marker2 in s:
              s = s.replace(marker2, "Center(child: _GalaxyModeStrip(worldCount: worlds.length, synced: synced, complete: complete, onAtlas: _openAtlas, onCommand: _openCommand))", 1)
          if 'if (_commandOpen) Positioned.fill' not in s:
              marker3 = "if (_atlasOpen) _GalaxyAtlas(worlds: worlds, selected: _commandSelection, visited: _visited, onClose: _closeAtlas, onOpen: (w) { _closeAtlas(); _openWorld(w); }),"
              addition = marker3 + "\n        if (_commandOpen) Positioned.fill(child: Material(color: const Color(0xE8010207), child: GalaxyCommandCenterPage(worlds: worlds, selected: _commandSelection, visited: _visited, onOpen: (w) { _closeCommand(); _openWorld(w); }))),"
              s = s.replace(marker3, addition, 1)
          if 'class _CommandButton' not in s:
              s += "\nclass _CommandButton extends StatelessWidget { final VoidCallback onTap; const _CommandButton({required this.onTap}); @override Widget build(BuildContext context) => Semantics(button: true, label: 'Open galaxy command center', child: Material(color: const Color(0xD905060D), child: InkWell(onTap: onTap, child: Container(padding: const EdgeInsets.symmetric(horizontal: 12, vertical: 9), decoration: BoxDecoration(border: Border.all(color: Colors.white18)), child: const Row(mainAxisSize: MainAxisSize.min, children: [Text('COMMAND', style: TextStyle(color: Colors.white65, fontSize: 7, letterSpacing: 1.6)), SizedBox(width: 7), Text('G', style: TextStyle(color: Colors.white25, fontSize: 6))]))))); }\n"
          s = s.replace("final VoidCallback onAtlas; const _GalaxyModeStrip({required this.worldCount, required this.synced, required this.complete, required this.onAtlas});", "final VoidCallback onAtlas, onCommand; const _GalaxyModeStrip({required this.worldCount, required this.synced, required this.complete, required this.onAtlas, required this.onCommand});", 1)
          needle = "Text('ATLAS', style: TextStyle(color: Colors.white60, fontSize: 5.5, letterSpacing: 1.2))"
          if needle in s and "Text('COMMAND'" not in s:
              s = s.replace(needle, "Text('ATLAS', style: TextStyle(color: Colors.white60, fontSize: 5.5, letterSpacing: 1.2)), const SizedBox(width: 8), Semantics(button: true, label: 'Open galaxy command center', child: InkWell(onTap: onCommand, child: const Padding(padding: EdgeInsets.all(3), child: Text('COMMAND', style: TextStyle(color: Colors.white60, fontSize: 5.5, letterSpacing: 1.2))))", 1)
          p.write_text(s)
          PY
      - name: Commit wire
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/screens/galaxy_home_page.dart
          git diff --cached --quiet && exit 0
          git commit -m 'GO88: command center wired [GO88-WIRED]'
          git push
