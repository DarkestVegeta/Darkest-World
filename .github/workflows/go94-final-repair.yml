name: GO94 Final Galaxy Repair
on:
  push:
    branches: [go59-galaxy-systems]
permissions:
  contents: write
jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[GO94-REPAIRED]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: go59-galaxy-systems
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Repair source
        shell: python
        run: |
          from pathlib import Path
          import re
          files = [
              Path('lib/main.dart'),
              Path('lib/screens/galaxy_home_page.dart'),
              Path('lib/screens/galaxy_command_center_page.dart'),
              Path('lib/widgets/darkest_world_universe.dart'),
          ]
          for p in files:
              s = p.read_text(encoding='utf-8')
              # Flutter has no Colors.whiteXX getters. Preserve the intended alpha as a real Color.
              def white(m):
                  n = max(0, min(100, int(m.group(1))))
                  a = round(n * 255 / 100)
                  return f'Color(0x{a:02X}FFFFFF)'
              s = re.sub(r'Colors\\.white(\\d+)', white, s)
              p.write_text(s, encoding='utf-8')

          # PointerScrollEvent lives in flutter/gestures.dart.
          p = Path('lib/widgets/darkest_world_universe.dart')
          s = p.read_text(encoding='utf-8')
          if 'PointerScrollEvent' in s and "import 'package:flutter/gestures.dart';" not in s:
              s = "import 'package:flutter/gestures.dart';\n" + s
          p.write_text(s, encoding='utf-8')

          # Remove the stale duplicate command helpers introduced by earlier automated wiring.
          p = Path('lib/screens/galaxy_home_page.dart')
          s = p.read_text(encoding='utf-8')
          lines = s.splitlines()
          seen_open = False
          seen_close = False
          out = []
          for line in lines:
              if 'void _openCommand()' in line:
                  if seen_open: continue
                  seen_open = True
              if 'void _closeCommand()' in line:
                  if seen_close: continue
                  seen_close = True
              out.append(line)
          p.write_text('\n'.join(out) + '\n', encoding='utf-8')
      - name: Format
        run: dart format lib test
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Test
        run: flutter test
      - name: Commit repaired source
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No source changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib test
          git commit -m 'GO94: Galaxy compile repair [GO94-REPAIRED]'
          git pull --rebase origin go59-galaxy-systems
          git push origin HEAD:go59-galaxy-systems
