name: GO98 Galaxy Stabilize

on:
  push:
    branches: [go59-galaxy-systems]
  workflow_dispatch:

jobs:
  stabilize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Repair Galaxy sources
        shell: python
        run: |
          from pathlib import Path
          import re

          files = [
              Path('lib/main.dart'),
              Path('lib/screens/galaxy_home_page.dart'),
              Path('lib/screens/galaxy_command_center_page.dart'),
              Path('lib/screens/game_world_planet_page.dart'),
              Path('lib/widgets/darkest_world_universe.dart'),
          ]

          def fix_colors(text):
              def repl(m):
                  pct = int(m.group(1))
                  alpha = round(255 * pct / 100)
                  return f'Color(0x{alpha:02X}FFFFFF)'
              return re.sub(r'Colors\.white(\d+)', repl, text)

          for path in files:
              text = fix_colors(path.read_text())
              path.write_text(text)

          # Replace the entire GalaxyHome keyboard handler with one valid handler.
          p = Path('lib/screens/galaxy_home_page.dart')
          text = p.read_text()
          start = text.find('  KeyEventResult key(')
          end = text.find('  @override Widget build', start)
          if start >= 0 and end > start:
              handler = '''  KeyEventResult key(FocusNode node, KeyEvent event) {\n    if (event is! KeyDownEvent) return KeyEventResult.ignored;\n    if (event.logicalKey == LogicalKeyboardKey.keyA) {\n      setState(() => atlas = !atlas);\n      return KeyEventResult.handled;\n    }\n    if (event.logicalKey == LogicalKeyboardKey.keyG) {\n      setState(() => command = !command);\n      return KeyEventResult.handled;\n    }\n    if (event.logicalKey == LogicalKeyboardKey.escape && (atlas || command)) {\n      setState(() { atlas = false; command = false; });\n      return KeyEventResult.handled;\n    }\n    return KeyEventResult.ignored;\n  }\n'''
              text = text[:start] + handler + text[end:]
          # Remove the unused legacy command button that still referenced invalid Colors.white* constants.
          text = re.sub(r'\nclass _CommandButton .*?\n$', '\n', text, flags=re.S)
          # The Atlas card's nested Column needs one additional close paren.
          text = text.replace("fontSize: 6))]));\n    })),", "fontSize: 6))]));\n    }))),")
          p.write_text(text)

          # Game-World map card: close Row, Container and InkWell before the itemBuilder callback closes.
          p = Path('lib/screens/game_world_planet_page.dart')
          text = p.read_text()
          text = text.replace("child: const Text('ENTER'))])); })));", "child: const Text('ENTER'))]))); }))));")
          p.write_text(text)

          # Procedural Galaxy map card: same nested-widget closure correction.
          p = Path('lib/widgets/darkest_world_universe.dart')
          text = p.read_text()
          text = text.replace("fontSize: 6))]));\n  }\n}", "fontSize: 6))]));\n  }\n}")
          # Explicitly repair the known GridView card ending if present.
          text = text.replace("fontSize: 6))]));\n    })),", "fontSize: 6)));\n    })),")
          p.write_text(text)
      - name: Format
        run: dart format lib test
      - name: Dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Commit repaired source
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No source changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib test
          git commit -m "GO111: stabilized Galaxy source"
          git push
