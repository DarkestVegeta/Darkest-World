<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body,#renderCanvas{margin:0;width:100%;height:100%;overflow:hidden;background:#010107}#renderCanvas{display:block;touch-action:none}</style></head><body><canvas id="renderCanvas"></canvas><script src="https://cdn.babylonjs.com/babylon.js"></script><script>(()=>{const c=document.getElementById("renderCanvas"),e=new BABYLON.Engine(c,true,{preserveDrawingBuffer:false,stencil:true,antialias:true});e.setHardwareScalingLevel(1.25);const s=new BABYLON.Scene(e);s.clearColor=new BABYLON.Color4(.003,.003,.012,1);const cam=new BABYLON.ArcRotateCamera("galaxyCamera",-Math.PI/2,1.12,28,BABYLON.Vector3.Zero(),s);cam.lowerRadiusLimit=8;cam.upperRadiusLimit=55;cam.wheelPrecision=45;cam.attachControl(c,true);const h=new BABYLON.HemisphericLight("fill",new BABYLON.Vector3(0,1,0),s);h.intensity=.35;const p=new BABYLON.PointLight("coreLight",BABYLON.Vector3.Zero(),s);p.intensity=2;p.range=10;const core=BABYLON.MeshBuilder.CreateSphere("DARK_CORE",{diameter:2.6,segments:24},s);const cm=new BABYLON.StandardMaterial("coreMat",s);cm.diffuseColor=new BABYLON.Color3(.012,.008,.02);cm.emissiveColor=new BABYLON.Color3(.12,.025,.16);cm.specularColor=BABYLON.Color3.Black();core.material=cm;const worlds=[["identity",-8,.8,0,2],["game",0,.5,8,2.25],["cinema",8,.7,0,2],["music",0,-.2,-8,2.1],["creation",-6.2,-.3,-5.2,1.8]];worlds.forEach((w,i)=>{const m=BABYLON.MeshBuilder.CreateSphere(w[0],{diameter:w[4],segments:20},s);m.position.set(w[1],w[2],w[3]);const mat=new BABYLON.StandardMaterial(w[0]+"Mat",s);mat.diffuseColor=new BABYLON.Color3(.025+i*.008,.03,.055+i*.006);mat.emissiveColor=new BABYLON.Color3(.012,.006,.022);m.material=mat;m.metadata={worldId:w[0]};});const r=BABYLON.MeshBuilder.CreateTorus("coreOrbit",{diameter:8.5,thickness:.018,tessellation:128},s);r.rotation.x=Math.PI/2;const rm=new BABYLON.StandardMaterial("ringMat",s);rm.emissiveColor=new BABYLON.Color3(.08,.025,.12);rm.alpha=.45;r.material=rm;s.onBeforeRenderObservable.add(()=>{core.rotation.y+=e.getDeltaTime()*.00008});e.runRenderLoop(()=>s.render());addEventListener("resize",()=>e.resize());window.DarkestWorldBabylon={version:"foundation-1",resetGalaxy:()=>{cam.setTarget(BABYLON.Vector3.Zero());cam.radius=28},focusWorld:id=>{const m=s.getMeshByName(id);if(!m)return false;cam.setTarget(m.position);return true}}})();</script></body></html>
