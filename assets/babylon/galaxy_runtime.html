<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>html,body,#renderCanvas{margin:0;width:100%;height:100%;overflow:hidden;background:#010107}#renderCanvas{display:block;touch-action:none}</style>
</head>
<body>
<canvas id="renderCanvas"></canvas>
<script src="https://cdn.babylonjs.com/babylon.js"></script>
<script>
(()=> {
  const canvas=document.getElementById("renderCanvas");
  const engine=new BABYLON.Engine(canvas,true,{preserveDrawingBuffer:false,stencil:true,antialias:true});
  engine.setHardwareScalingLevel(1.25);
  const scene=new BABYLON.Scene(engine);
  scene.clearColor=new BABYLON.Color4(.003,.003,.012,1);

  const camera=new BABYLON.ArcRotateCamera("galaxyCamera",-Math.PI/2,1.12,28,BABYLON.Vector3.Zero(),scene);
  camera.lowerRadiusLimit=8;
  camera.upperRadiusLimit=55;
  camera.wheelPrecision=45;
  camera.attachControl(canvas,true);

  const fill=new BABYLON.HemisphericLight("fill",new BABYLON.Vector3(0,1,0),scene);
  fill.intensity=.35;
  const coreLight=new BABYLON.PointLight("coreLight",BABYLON.Vector3.Zero(),scene);
  coreLight.intensity=2;
  coreLight.range=10;

  const core=BABYLON.MeshBuilder.CreateSphere("DARK_CORE",{diameter:2.6,segments:24},scene);
  const coreMat=new BABYLON.StandardMaterial("coreMat",scene);
  coreMat.diffuseColor=new BABYLON.Color3(.012,.008,.02);
  coreMat.emissiveColor=new BABYLON.Color3(.12,.025,.16);
  coreMat.specularColor=BABYLON.Color3.Black();
  core.material=coreMat;

  const ring=BABYLON.MeshBuilder.CreateTorus("coreOrbit",{diameter:8.5,thickness:.018,tessellation:128},scene);
  ring.rotation.x=Math.PI/2;
  const ringMat=new BABYLON.StandardMaterial("ringMat",scene);
  ringMat.emissiveColor=new BABYLON.Color3(.08,.025,.12);
  ringMat.alpha=.45;
  ring.material=ringMat;

  const runtimeNodes=new Map();
  let streamingPolicy={loadDistance:20,unloadDistance:28};
  let travelTarget=null;
  let travelStart=null;
  let travelProgress=1;

  function materialFor(node){
    const m=new BABYLON.StandardMaterial("mat_"+node.id,scene);
    if(node.nodeType==="planet"){
      m.diffuseColor=new BABYLON.Color3(.025,.035,.06);
      m.emissiveColor=new BABYLON.Color3(.012,.006,.022);
    } else if(node.nodeType==="area"){
      m.diffuseColor=new BABYLON.Color3(.045,.03,.07);
      m.emissiveColor=new BABYLON.Color3(.02,.006,.035);
    } else {
      m.diffuseColor=new BABYLON.Color3(.03,.03,.05);
      m.emissiveColor=new BABYLON.Color3(.008,.004,.016);
    }
    return m;
  }

  function removeRuntimeNode(id){
    const m=runtimeNodes.get(id);
    if(m){m.dispose();runtimeNodes.delete(id);}
  }

  function applyRuntimeNodes(nodes){
    const incoming=new Set(nodes.map(n=>n.id));
    [...runtimeNodes.keys()].forEach(id=>{if(!incoming.has(id))removeRuntimeNode(id);});
    nodes.forEach(node=>{
      let mesh=runtimeNodes.get(node.id);
      if(!mesh){
        const segments=node.nodeType==="planet"?20:node.nodeType==="area"?14:10;
        mesh=BABYLON.MeshBuilder.CreateSphere("node_"+node.id,{diameter:Math.max(.25,node.radius*2),segments},scene);
        mesh.material=materialFor(node);
        runtimeNodes.set(node.id,mesh);
      }
      const p=node.position||[0,0,0];
      mesh.position.set(p[0]||0,p[1]||0,p[2]||0);
      mesh.metadata=node;
      mesh.setEnabled(true);
    });
  }

  function updateStreaming(){
    const cameraPosition=camera.position;
    runtimeNodes.forEach(mesh=>{
      const d=BABYLON.Vector3.Distance(cameraPosition,mesh.position);
      mesh.setEnabled(d<=streamingPolicy.unloadDistance);
      mesh.metadata={...(mesh.metadata||{}),distance:d};
    });
  }

  function focusWorld(nodeKey){
    const mesh=[...runtimeNodes.values()].find(x=>x.metadata&&x.metadata.nodeKey===nodeKey);
    if(!mesh)return false;
    travelStart=camera.target.clone();
    travelTarget=mesh.position.clone();
    travelProgress=0;
    return true;
  }

  function updateTravel(){
    if(!travelTarget||!travelStart||travelProgress>=1)return;
    travelProgress=Math.min(1,travelProgress+engine.getDeltaTime()*.0018);
    const eased=1-Math.pow(1-travelProgress,3);
    camera.setTarget(BABYLON.Vector3.Lerp(travelStart,travelTarget,eased));
    if(travelProgress>=1){travelStart=null;travelTarget=null;}
  }

  scene.onBeforeRenderObservable.add(()=>{
    const dt=engine.getDeltaTime();
    core.rotation.y+=dt*.00008;
    ring.rotation.z+=dt*.00001;
    updateTravel();
    updateStreaming();
  });

  engine.runRenderLoop(()=>scene.render());
  addEventListener("resize",()=>engine.resize());

  window.DarkestWorldBabylon={
    version:"foundation-3",
    setNodes:applyRuntimeNodes,
    setStreamingPolicy:p=>{streamingPolicy={...streamingPolicy,...p}},
    resetGalaxy:()=>{
      camera.setTarget(BABYLON.Vector3.Zero());
      camera.radius=28;
      travelStart=null;travelTarget=null;travelProgress=1;
    },
    focusWorld
  };
})();
</script>
</body>
</html>
